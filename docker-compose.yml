services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_dev_password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aurora:${POSTGRES_PASSWORD:-aurora_dev_password}@db:5432/aurora
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
